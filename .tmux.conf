set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -gq allow-passthrough on
set -g mouse on

set -gu status-bg
set -gu status-fg
set -g status-style "fg=colour4,bg=terminal"
set -g status-interval 5

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g message-style "fg=terminal,bg=terminal"

set -sg escape-time 10

set -g status-right "%H:%M %Y-%m-%d"

# Vim-style pane navigation: prefix + h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes: prefix + H/J/K/L, then keep tapping to repeat.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Scroll mode (prefix + [): v to select, y to yank to the macOS clipboard.
# Selection stays inside the current pane, so multi-line copies never grab a neighbour pane.
# ponytail: stock Enter and mouse-drag bindings already pipe to copy-command, so only v/y need binding.
set -g mode-keys vi
set -s copy-command pbcopy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
